name: SHATTERWAKE - isolated art prototype

on:
  push:
    branches: [art/hero-fighter-v1]
    paths:
      - 'art/hero_fighter/build_master.py'
      - '.github/workflows/hero-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy python3-pil
      - name: Validate script and remove old generated files
        run: |
          python3 -m py_compile art/hero_fighter/build_master.py
          # Keep previously reviewed ship/hardpoints identical; remove only
          # the new render targets so stale PNGs can never pass validation.
          rm -f art/hero_fighter/hero_fighter.blend
          rm -f art/hero_fighter/previews/werft_{magnet*,target*,special*,repair*,damage_state*}.{png,jpg}
          rm -f art/hero_fighter/staging/game/fighter_module_{2,3,6,7}*.png
          rm -f art/hero_fighter/staging/werft/fighter_module_{2,3,6,7}*.png
          rm -f art/hero_fighter/staging/game/fighter_hull_damage_*.png
          rm -f art/hero_fighter/staging/werft/fighter_hull_damage_*.png
      - name: Build editable 3D master and image previews, without touching Android
        run: |
          SW_ART_UPDATE_ONLY=1 blender -b -t 4 --python art/hero_fighter/build_master.py -- art/hero_fighter
          test -s art/hero_fighter/hero_fighter.blend
          for key in werft_magnet werft_magnet_max werft_target werft_target_max \
                     werft_special werft_repair werft_damage_state_1 \
                     werft_damage_state_2 werft_damage_state_3; do
            test -s "art/hero_fighter/previews/${key}.png"
          done
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path("art/hero_fighter/previews")
          names=["werft_magnet","werft_magnet_max","werft_target",
                 "werft_target_max","werft_special","werft_repair",
                 "werft_damage_state_1","werft_damage_state_2",
                 "werft_damage_state_3"]
          for name in names:
              src=root/(name+".png")
              im=Image.open(src).convert("RGB")
              assert im.size==(1000,900),(name,im.size)
              im.save(root/(name+".jpg"),quality=88,optimize=True,subsampling=0)
          PY
      - name: Validate real PNG output and transparent layers
        run: |
          python3 - <<'PY'
          import os,struct,json
          root="art/hero_fighter"
          preview=["werft_before","werft_weapons","werft_damage",
                   "werft_shield","werft_drones","werft_magnet","werft_magnet_max",
                   "werft_target","werft_target_max","werft_special","werft_repair",
                   "werft_damage_state_1","werft_damage_state_2","werft_damage_state_3"]
          expected={"previews/"+p+".png":(1000,900) for p in preview}
          expected["previews/game_nose_up.png"]=(1024,1024)
          for view,size in (("game",1024),("werft",2048)):
              prefix="staging/"+view+"/"
              names=["fighter_base.png"]+["fighter_module_%d.png"%n for n in range(8)]
              names += ["fighter_module_3_L%d.png"%k for k in (2,3)]
              names += ["fighter_module_7_L%d.png"%k for k in (2,3,4,5)]
              names += ["fighter_hull_damage_%d.png"%k for k in (1,2,3)]
              for name in names:expected[prefix+name]=(size,size)
          for relative,dim in expected.items():
              path=os.path.join(root,relative)
              with open(path,"rb") as f:hdr=f.read(26)
              assert hdr[:8]==b'\x89PNG\r\n\x1a\n',relative
              assert struct.unpack(">II",hdr[16:24])==dim,(relative,"dimensions")
              assert hdr[25]==6,(relative,"must be RGBA")
              print("ART-004 validated",relative,os.stat(path).st_size,flush=True)
          assert os.stat(root+"/hero_fighter.blend").st_size>100000
          with open(root+"/render_report.json","w") as f:
              json.dump({"status":"new_graphics_rendered_not_yet_user_approved",
                         "modules":[0,1,2,3,4,5,6,7],
                         "magnet_stages":[1,2,3],"target_stages":[1,2,3,4,5],
                         "hull_damage_tiers":[1,2,3],
                         "original_project_geometry":True,"files":expected},f,indent=2)
          PY
      - name: Publish previews and editable master to ART branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve ONLY rendered files, not the old checked-out source code
          # nor the separately generated/stored fighter_layout.json.
          tar -cf /tmp/shatterwake-art.tar -C art/hero_fighter \
            hero_fighter.blend previews staging/game staging/werft render_report.json
          # A concurrent layout job / old renderer may have updated this branch.
          # Always install artifacts on top of the current HEAD to prevent
          # Git binary-file merge/rebase conflicts and stale source overwrites.
          git fetch origin art/hero-fighter-v1
          git reset --hard FETCH_HEAD
          tar -xf /tmp/shatterwake-art.tar -C art/hero_fighter
          git add -f art/hero_fighter/hero_fighter.blend \
            art/hero_fighter/previews art/hero_fighter/staging/game \
            art/hero_fighter/staging/werft art/hero_fighter/render_report.json
          git commit -m 'Render complete eight-system Hero Fighter sprites [skip ci]' || true
          git push origin HEAD:art/hero-fighter-v1
