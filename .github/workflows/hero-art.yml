name: SHATTERWAKE - isolated art prototype

on:
  push:
    branches: [art/hero-fighter-v1]
    paths:
      - 'art/hero_fighter/build_master.py'
      - '.github/workflows/hero-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy python3-pil
      - name: Validate script and remove old generated files
        run: |
          python3 -m py_compile art/hero_fighter/build_master.py
          # No pre-existing renders may satisfy the artifact validator.
          rm -f art/hero_fighter/hero_fighter.blend
          rm -f art/hero_fighter/previews/*.png art/hero_fighter/previews/*.jpg
          rm -f art/hero_fighter/staging/game/*.png art/hero_fighter/staging/werft/*.png
      - name: Build editable 3D master and image previews, without touching Android
        run: |
          blender -b -t 4 --python art/hero_fighter/build_master.py -- art/hero_fighter
          test -s art/hero_fighter/previews/werft_before.png
          test -s art/hero_fighter/hero_fighter.blend
          test -s art/hero_fighter/previews/werft_weapons.png
          test -s art/hero_fighter/previews/werft_shield.png
          test -s art/hero_fighter/previews/werft_drones.png
          # Never pass with an old committed render while Blender failed.
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import time
          images=Path("art/hero_fighter/previews")
          for path in images.glob("*.png"):
              assert time.time()-path.stat().st_mtime < 3600,("stale render",path)
          PY
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path("art/hero_fighter/previews")
          for key in ["werft_before","werft_weapons","werft_shield","werft_drones"]:
              img=Image.open(root/(key+".png")).convert("RGB")
              img.save(root/(key+".jpg"),quality=90,subsampling=0,optimize=True)
          PY
      - name: Validate outputs
        run: |
          python3 - <<'PY'
          import os,struct,json
          root="art/hero_fighter"
          dimensions={
            "previews/werft_before.png":(1000,900),
            "previews/werft_weapons.png":(1000,900),
            "previews/werft_shield.png":(1000,900),
            "previews/werft_drones.png":(1000,900),
            "previews/game_nose_up.png":(1024,1024)}
          for view,res in [("game",1024),("werft",2048)]:
              for name in ["fighter_base.png","fighter_module_0.png",
                           "fighter_module_4.png","fighter_module_5.png"]:
                  dimensions["staging/"+view+"/"+name]=(res,res)
          for name,expected in dimensions.items():
              path=os.path.join(root,name)
              with open(path,"rb") as f:hdr=f.read(26)
              assert hdr[:8]==b'\x89PNG\r\n\x1a\n',name
              assert struct.unpack(">II",hdr[16:24])==expected,(name,"dimensions")
              assert hdr[25]==6,(name,"RGBA required")
              print("VERIFIED",name,os.stat(path).st_size)
          assert os.stat(root+"/hero_fighter.blend").st_size>100000
          with open(root+"/render_report.json","w") as f:
              json.dump({"status":"rendered_not_approved",
                         "author":"original SHATTERWAKE Blender construction",
                         "no_external_assets":True,
                         "outputs":dimensions},f,indent=2)
          PY
      - name: Publish previews and editable master to ART branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f art/hero_fighter/hero_fighter.blend \
            art/hero_fighter/previews art/hero_fighter/staging \
            art/hero_fighter/render_report.json
          git commit -m 'Render hero fighter visual previews, editable master and sprite exports [skip ci]' || true
          git push origin HEAD:art/hero-fighter-v1
