name: SHATTERWAKE - create compact art review images

on:
  push:
    branches: [art/hero-fighter-v1]
    paths:
      - '.github/workflows/hero-review-jpeg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for review previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
      - name: Build compact high-quality JPEG previews
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          folder=Path("art/hero_fighter/previews")
          for name in ["werft_before","werft_weapons","werft_shield","werft_drones"]:
              source=folder/(name+".png")
              assert source.exists(),source
              im=Image.open(source).convert("RGB")
              im.save(folder/(name+".jpg"),format="JPEG",quality=88,optimize=True,subsampling=0)
              print(name,"->",(folder/(name+".jpg")).stat().st_size)
          PY
      - name: Commit smaller review files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f art/hero_fighter/previews/*.jpg
          git commit -m 'Export portable Werft comparison images [skip ci]' || true
          git push origin HEAD:art/hero-fighter-v1
