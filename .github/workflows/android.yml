name: Build native Android APK

on:
  push:
    branches: [main, prototype-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bootstrap source archive if supplied
        run: |
          if [ -f project.bundle.b64 ]; then
            base64 --decode project.bundle.b64 | tar -xJf -
          fi
          test -f app/src/main/java/de/shatterwake/game/GameView.java
      - name: Verify pure Java game rules
        run: |
          mkdir -p /tmp/sw-test
          javac -d /tmp/sw-test app/src/main/java/de/shatterwake/game/GameRules.java tests/RuleChecks.java
          java -ea -cp /tmp/sw-test de.shatterwake.game.RuleChecks
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare artifact + checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SHATTERWAKE-v0.1.0-alpha-debug.apk
          cd out
          sha256sum SHATTERWAKE-v0.1.0-alpha-debug.apk > SHA256SUMS.txt
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SHATTERWAKE-v0.1.0-alpha-APK
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Populate GitHub with readable sources after main branch merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f project.bundle.b64 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            rm -f project.bundle.b64
            git add -A
            git commit -m 'Expand verified Android source bundle' || true
            git push origin HEAD:main
          fi
      - name: Create downloadable GitHub prerelease APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-alpha >/dev/null 2>&1; then
            gh release upload v0.1.0-alpha out/SHATTERWAKE-v0.1.0-alpha-debug.apk out/SHA256SUMS.txt --clobber
          else
            gh release create v0.1.0-alpha out/SHATTERWAKE-v0.1.0-alpha-debug.apk out/SHA256SUMS.txt \
              --title 'SHATTERWAKE 0.1.0-alpha (test build)' --prerelease \
              --notes 'Playable Android prototype. Debug-signed APK for private testing only, NOT a production or Google Play release. No external game assets or runtime dependencies. See licensing and release checklist.'
          fi