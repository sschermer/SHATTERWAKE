name: Build native Android APK

on:
  push:
    branches: [main, prototype-v0.1, balance-v0.2, release-v0.3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Accept SDK licenses from preinstalled GitHub SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_BIN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDK_BIN" >> "$GITHUB_ENV"
          yes | "$SDK_BIN" --licenses >/dev/null || true
      - name: Install Android 16 API 36
        run: '"$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"'
      - name: Bootstrap source archive if supplied
        run: |
          if [ -f project.bundle.b64 ]; then
            cp .github/workflows/android.yml /tmp/shatterwake-workflow.yml
            base64 --decode project.bundle.b64 | tar -xJf -
            cp /tmp/shatterwake-workflow.yml .github/workflows/android.yml
            sed -i 's/, `android-actions\/setup-android@v3`//' THIRD_PARTY_NOTICES.md
          fi
          test -f app/src/main/java/de/shatterwake/game/GameView.java
      - name: Verify pure Java game rules
        run: |
          mkdir -p /tmp/sw-test
          javac -d /tmp/sw-test app/src/main/java/de/shatterwake/game/GameRules.java tests/RuleChecks.java
          java -ea -cp /tmp/sw-test de.shatterwake.game.RuleChecks
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare artifact + checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SHATTERWAKE-v0.3.0-alpha-debug.apk
          cd out
          sha256sum SHATTERWAKE-v0.3.0-alpha-debug.apk > SHA256SUMS.txt
      - name: Verify installable APK and checksum
        run: |
          test -s out/SHATTERWAKE-v0.3.0-alpha-debug.apk
          (cd out && sha256sum -c SHA256SUMS.txt)
      - name: Publish APK in repository without Actions artifact quota
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p dist
          cp out/SHATTERWAKE-v0.3.0-alpha-debug.apk dist/
          cp out/SHA256SUMS.txt dist/
          git add -f dist/SHATTERWAKE-v0.3.0-alpha-debug.apk dist/SHA256SUMS.txt
          git commit -m 'Publish tested SHATTERWAKE 0.2 alpha APK [skip ci]' || true
          git push origin HEAD:main
      - name: Create downloadable GitHub prerelease APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0-alpha >/dev/null 2>&1; then
            gh release upload v0.3.0-alpha out/SHATTERWAKE-v0.3.0-alpha-debug.apk out/SHA256SUMS.txt --clobber
          else
            gh release create v0.3.0-alpha out/SHATTERWAKE-v0.3.0-alpha-debug.apk out/SHA256SUMS.txt \
              --title 'SHATTERWAKE 0.3.0-alpha (test build)' --prerelease \
              --notes 'Playable Android prototype. Debug-signed APK for private testing only, NOT a production or Google Play release. No external game assets or runtime dependencies. See licensing and release checklist.'
          fi