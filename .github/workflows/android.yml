name: Build native Android APK

on:
  push:
    branches: [main, prototype-v0.1, balance-v0.2, release-v0.3, tutorial-art-v0.4]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Accept SDK licenses from preinstalled GitHub SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_BIN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDK_BIN" >> "$GITHUB_ENV"
          yes | "$SDK_BIN" --licenses >/dev/null || true
      - name: Install Android 16 API 36
        run: '"$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"'
      - name: Bootstrap source archive if supplied
        run: |
          if [ -f project.bundle.b64 ]; then
            cp .github/workflows/android.yml /tmp/shatterwake-workflow.yml
            base64 --decode project.bundle.b64 | tar -xJf -
            cp /tmp/shatterwake-workflow.yml .github/workflows/android.yml
            sed -i 's/, `android-actions\/setup-android@v3`//' THIRD_PARTY_NOTICES.md
          fi
          test -f app/src/main/java/de/shatterwake/game/GameView.java
      - name: Verify approved project-authored fighter and Werft art
        run: |
          set -eu
          root=app/src/main/assets/rendered
          test -s "$root/fighter_base.png"
          test -s "$root/fighter_layout.json"
          test -s "$root/werft/fighter_base.png"
          test -s "$root/werft/hangar_background.png"
          for i in 0 1 2 3 4 5 6 7; do
            test -s "$root/fighter_module_${i}.png"
            test -s "$root/werft/fighter_module_${i}.png"
          done
          for tier in 2 3; do
            test -s "$root/fighter_module_3_L${tier}.png"
            test -s "$root/werft/fighter_module_3_L${tier}.png"
          done
          for tier in 2 3 4 5; do
            test -s "$root/fighter_module_7_L${tier}.png"
            test -s "$root/werft/fighter_module_7_L${tier}.png"
          done
          for tier in 1 2 3; do
            test -s "$root/fighter_hull_damage_${tier}.png"
            test -s "$root/werft/fighter_hull_damage_${tier}.png"
          done
          python3 - <<'PY'
          import json,os,struct
          root="app/src/main/assets/rendered"
          with open(root+"/fighter_layout.json") as f:a=json.load(f)
          assert list(map(int,a["modules_available"]))==list(range(8))
          game=a["views"]["game"]
          px=game["projected_anchors"]
          assert px["nose"][1]<px["tail"][1]
          assert abs(px["nose"][0]-px["tail"][0])<25
          paths=[root+"/fighter_base.png",root+"/werft/fighter_base.png",
                 root+"/werft/hangar_background.png"]
          for v,size in (("",1024),("werft/",2048)):
            for i in range(8):paths.append(root+"/"+v+"fighter_module_%d.png"%i)
            for lvl in (2,3):paths.append(root+"/"+v+"fighter_module_3_L%d.png"%lvl)
            for lvl in (2,3,4,5):paths.append(root+"/"+v+"fighter_module_7_L%d.png"%lvl)
            for lvl in (1,2,3):paths.append(root+"/"+v+"fighter_hull_damage_%d.png"%lvl)
          for path in paths:
            with open(path,"rb") as f:h=f.read(26)
            assert h[:8]==b'\x89PNG\r\n\x1a\n',path
            expected=2048 if "/werft/" in path else 1024
            assert struct.unpack(">II",h[16:24])==(expected,expected),path
            assert h[25]==6,path
          print("PASS: all approved original PNG sprites and camera anchors",len(paths))
          PY
      - name: Verify original enemy-fleet renders
        run: |
          python3 - <<'PY'
          import os,struct
          path="app/src/main/assets/rendered/enemies"
          for i in range(8):
            name=os.path.join(path,"enemy_%d.png"%i)
            with open(name,"rb") as f:header=f.read(26)
            assert header[:8]==b'\x89PNG\r\n\x1a\n',name
            assert struct.unpack(">II",header[16:24])==(640,640),name
            assert header[25]==6,name
          print("PASS: original 3D fleet: 8 RGBA sprites",flush=True)
          PY
      - name: Validate all approved Kettenwurm boss sprites against Blender SHA256
        run: python3 tests/check_kettenwurm_assets.py
      - name: Verify pure Java game rules
        run: |
          mkdir -p /tmp/sw-test
          javac -d /tmp/sw-test app/src/main/java/de/shatterwake/game/GameRules.java app/src/main/java/de/shatterwake/game/TutorialRules.java app/src/main/java/de/shatterwake/game/FlightPaths.java tests/RuleChecks.java tests/TutorialChecks.java tests/FlightPathChecks.java
          java -ea -cp /tmp/sw-test de.shatterwake.game.RuleChecks
          java -ea -cp /tmp/sw-test de.shatterwake.game.TutorialChecks
          java -ea -cp /tmp/sw-test de.shatterwake.game.FlightPathChecks
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify approved 3D fighter assets are inside the actual APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              contents=set(archive.namelist())
          required={"assets/rendered/fighter_base.png",
                    "assets/rendered/fighter_layout.json",
                    "assets/rendered/werft/fighter_base.png",
                    "assets/rendered/werft/hangar_background.png"}
          for view in ("","werft/"):
              prefix="assets/rendered/"+view
              required.update(prefix+"fighter_module_%d.png"%i for i in range(8))
              required.update(prefix+"fighter_module_3_L%d.png"%i for i in (2,3))
              required.update(prefix+"fighter_module_7_L%d.png"%i for i in (2,3,4,5))
              required.update(prefix+"fighter_hull_damage_%d.png"%i for i in (1,2,3))
          required.update("assets/rendered/enemies/enemy_%d.png"%i for i in range(8))
          missing=required-contents
          assert not missing,("Missing approved art in APK",sorted(missing))
          print("PASS: 46 original 3D art files and layout packaged")
          PY
      - name: Verify approved Kettenwurm assets inside the actual APK
        run: python3 tests/check_kettenwurm_assets.py app/build/outputs/apk/debug/app-debug.apk
      # Keep test/debug builds as CI checks; NEVER distribute their ephemeral key.
      # Configure two repository-level GitHub Actions secrets to enable real
      # update signing. One missing secret is an error, not a fallback.
      - name: Configure permanent private APK signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SHATTERWAKE_KEYSTORE_BASE64: ${{ secrets.SHATTERWAKE_KEYSTORE_BASE64 }}
          SHATTERWAKE_KEYSTORE_PASSWORD: ${{ secrets.SHATTERWAKE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SHATTERWAKE_KEYSTORE_BASE64" ] && [ -z "$SHATTERWAKE_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Signed release not yet configured. Add the two GitHub Actions signing secrets and rerun this workflow."
            echo "SHATTERWAKE_SIGNING_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$SHATTERWAKE_KEYSTORE_BASE64" ] || [ -z "$SHATTERWAKE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets incomplete: require both KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/shatterwake-signing"
          printf '%s' "$SHATTERWAKE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shatterwake-signing/shatterwake.p12"
          chmod 600 "$RUNNER_TEMP/shatterwake-signing/shatterwake.p12"
          keytool -list -keystore "$RUNNER_TEMP/shatterwake-signing/shatterwake.p12" \
            -storetype PKCS12 -alias shatterwake-updates \
            -storepass:env SHATTERWAKE_KEYSTORE_PASSWORD >/dev/null
          echo "SHATTERWAKE_KEYSTORE_PATH=$RUNNER_TEMP/shatterwake-signing/shatterwake.p12" >> "$GITHUB_ENV"
          # A new run number is higher than any previous build of this workflow.
          echo "SHATTERWAKE_BUILD_NUMBER=$((10000+GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "SHATTERWAKE_VERSION_NAME=0.6.2-alpha.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "SHATTERWAKE_SIGNING_READY=true" >> "$GITHUB_ENV"
      - name: Build installable permanently signed release APK
        if: env.SHATTERWAKE_SIGNING_READY == 'true'
        env:
          SHATTERWAKE_KEYSTORE_PASSWORD: ${{ secrets.SHATTERWAKE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK signing certificate matches SHATTERWAKE forever key
        if: env.SHATTERWAKE_SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature-check.txt"
          cat "$RUNNER_TEMP/signature-check.txt"
          actual=$(awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2)}' "$RUNNER_TEMP/signature-check.txt" | head -n 1)
          expected="12fc96a90b8ca79d7e01f8e1a420f97e872ec71dc32ebe2b10ba59919776fc06"
          test -n "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Wrong signing certificate: refusing to publish an APK that would break updates."
            exit 1
          fi
          echo "PASS: correctly signed APK, trusted permanent certificate SHA256=$actual"
      - name: Package signed release and checksum
        if: env.SHATTERWAKE_SIGNING_READY == 'true'
        run: |
          mkdir -p out/signed
          cp app/build/outputs/apk/release/app-release.apk out/signed/SHATTERWAKE-v0.6.2-alpha-signed.apk
          (cd out/signed && sha256sum SHATTERWAKE-v0.6.1-alpha-signed.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish signed APK to separate stable-key GitHub prerelease
        if: env.SHATTERWAKE_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.6.2-alpha
          apk=out/signed/SHATTERWAKE-v0.6.1-alpha-signed.apk
          sums=out/signed/SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$sums" --clobber
          else
            gh release create "$tag" "$apk" "$sums" \
              --title 'SHATTERWAKE 0.6.2-alpha - Kettenwurm Bossgrafik (signiert)' --prerelease \
              --notes 'Sector 1: original Blender Kettenwurm, 12 modular boss nodes with four per-node HP-dependent damage visuals, sparks and destruction frames. Stable signing certificate matches v0.6.1-alpha. Existing game saves are preserved by normal update installation (same package name, signing key, larger versionCode). Original Blender source and SHA256 checks are documented in the repository. No telemetry or remote content.'
          fi
      - name: Remove temporary signing keystore from CI runner
        if: always()
        run: rm -f "$RUNNER_TEMP/shatterwake-signing/shatterwake.p12"
