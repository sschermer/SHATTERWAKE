name: SHATTERWAKE - Android integration compile check

on:
  push:
    branches: [feature/hero-fighter-game-integration]
    paths:
      - '.github/workflows/hero-integration-ci.yml'
      - 'app/src/main/java/**'
      - 'tests/**'
      - 'app/src/main/assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_BIN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDKMANAGER=$SDK_BIN" >> "$GITHUB_ENV"
          yes | "$SDK_BIN" --licenses >/dev/null || true
      - name: Install Android API 36
        run: '"$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"'
      - name: Validate game rules
        run: |
          mkdir -p /tmp/sw-test
          javac -d /tmp/sw-test app/src/main/java/de/shatterwake/game/GameRules.java app/src/main/java/de/shatterwake/game/TutorialRules.java tests/RuleChecks.java tests/TutorialChecks.java
          java -ea -cp /tmp/sw-test de.shatterwake.game.RuleChecks
          java -ea -cp /tmp/sw-test de.shatterwake.game.TutorialChecks
      - name: Compile Android art integration
        run: gradle --no-daemon --stacktrace :app:assembleDebug
