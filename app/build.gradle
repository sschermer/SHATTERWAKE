plugins { id 'com.android.application' }

android {
    namespace 'de.shatterwake.game'
    compileSdk 36

    defaultConfig {
        applicationId 'de.shatterwake.game'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5.0-alpha'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No application/runtime third-party libraries. Android framework APIs only.
